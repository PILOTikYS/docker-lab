services:
  web:
    image: nginx:latest
    ports:
      - "8080:80"   # Пробрасываем порт 8080 снаружи на порт 80 внутри контейнера
    volumes:
      - ./html:/usr/share/nginx/html  # Монтируем нашу папку с html-файлами внутрь контейнера
    depends_on:
      - redis

  redis:
    image: redis:alpine
